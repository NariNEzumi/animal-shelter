<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>{{ animal.name }}</title>

<style>

body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

nav {
    background: #ff7b00;
    padding: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.container img {
    width: 100%;
    border-radius: 15px;
}

h1 {
    margin-top: 20px;
}

.info {
    font-size: 18px;
}

.info p {
    margin: 10px 0;
}

/* история — без визуального “дизайна”, просто текст */
.story {
    margin-top: 15px;
}

</style>
</head>

<body>

<nav>
    <a href="/">Главная</a>
    <a href="/animals">Все животные</a>
    <a href="/contacts">Контакты</a>
</nav>

<div class="container">

    <img src="{{ animal.img }}" alt="{{ animal.name }}">

    <h1>{{ animal.name }}</h1>

    <div class="info">

    <p><b>Порода:</b> {{ animal.breed }}</p>

    <p><b>Дата поступления:</b> {{ animal.arrived }}</p>

    <p><b>Описание:</b> {{ animal.desc }}</p>

    <p><b>История:</b> {{ animal.story }}</p>

</div>
</div>

</body>
</html>
