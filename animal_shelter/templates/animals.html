<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Все животные</title>

<style>

body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

nav {
    background: #ff7b00;
    padding: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

h1 {
    text-align: center;
    margin-top: 30px;
}

.animals {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 30px;
    max-width: 1100px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    text-align: center;
    text-decoration: none;
    color: black;
    display: block;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.02);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card h3 {
    margin: 10px 0 5px;
}

.card p {
    margin-bottom: 15px;
    color: #444;
}

</style>
</head>

<body>

<nav>
    <a href="/">Главная</a>
    <a href="/animals">Все животные</a>
    <a href="/contacts">Контакты</a>
</nav>

<h1>Наши животные</h1>

<div class="animals">

{% for id, animal in animals.items() %}

<a href="/animal/{{ id }}" class="card">

    <img src="{{ animal.img }}" alt="{{ animal.name }}">

    <h3>{{ animal.name }}</h3>

    <p>{{ animal.breed }}</p>

</a>

{% endfor %}

</div>

</body>
</html>
